services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mmotors:mmotors@db:5432/mmotors
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mmotors
      POSTGRES_PASSWORD: mmotors
      POSTGRES_DB: mmotors
    ports:
      - "5432:5432"
    volumes:
      - mmotors_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmotors"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mmotors_pgdata:
